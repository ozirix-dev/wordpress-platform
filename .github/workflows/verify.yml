name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: wordpress-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify change scope
        id: scope
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $level = 'full'
          }
          else {
            $base = if ($env:EVENT_NAME -eq 'pull_request') { $env:PR_BASE_SHA } else { $env:BEFORE_SHA }
            $baseExists = $false
            if (-not [string]::IsNullOrWhiteSpace($base) -and $base -notmatch '^0+$') {
              git cat-file -e "$base^{commit}" 2>$null
              $baseExists = $LASTEXITCODE -eq 0
            }
            if (-not $baseExists) {
              $level = 'full'
            }
            else {
              $paths = @(git diff --name-only $base $env:HEAD_SHA)
              if ($LASTEXITCODE -ne 0 -or $paths.Count -eq 0) {
                $level = 'full'
              }
              else {
                $level = 'docs'
                foreach ($path in $paths) {
                  if ($path -notmatch '(^|/)(README|AGENTS)(\.[^/]+)?$' -and $path -notmatch '\.md$') {
                    $level = 'full'
                    break
                  }
                }
              }
            }
          }
          "level=$level" | Set-Content -Path $env:GITHUB_OUTPUT -Encoding utf8NoBOM

      - name: Set up PHP
        if: steps.scope.outputs.level == 'full'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install PowerShell modules
        if: steps.scope.outputs.level == 'full'
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module `
            -Name PSScriptAnalyzer `
            -RequiredVersion 1.25.0 `
            -Scope CurrentUser `
            -Force `
            -ErrorAction Stop
          Install-Module `
            -Name Pester `
            -RequiredVersion 5.7.1 `
            -Scope CurrentUser `
            -Force `
            -SkipPublisherCheck `
            -ErrorAction Stop

      - name: Markdown lint
        shell: pwsh
        run: npx --yes markdownlint-cli2

      - name: Public safety grep
        shell: pwsh
        run: ./tools/check-public-safety.ps1

      - name: PowerShell parser check
        if: steps.scope.outputs.level == 'full'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $scripts = Get-ChildItem -Recurse -File -Include *.ps1,*.psm1,*.psd1 |
            Select-Object -ExpandProperty FullName
          foreach ($scriptPath in $scripts) {
            $script = (Resolve-Path $scriptPath).Path
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script,
              [ref] $tokens,
              [ref] $errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}: {1}" -f $scriptPath, $_.Message)
              }
              throw "PowerShell parser errors found"
            }
          }

      - name: PowerShell static analysis
        if: steps.scope.outputs.level == 'full'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning
          if ($results) {
            $results | Format-Table -AutoSize | Out-String
            throw "PSScriptAnalyzer reported issues"
          }

      - name: PHP syntax lint
        if: steps.scope.outputs.level == 'full'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem -Recurse -File -Filter *.php |
            Select-Object -ExpandProperty FullName
          foreach ($file in $files) {
            php -l $file
            if ($LASTEXITCODE -ne 0) {
              throw "php lint failed: $file"
            }
          }

      - name: Pester tests
        if: steps.scope.outputs.level == 'full'
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          Invoke-Pester -Path tests -CI

      - name: Package helper smoke test
        if: steps.scope.outputs.level == 'full'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $script = (Resolve-Path "templates/site-repo-starter/tools/package-deployable.ps1").Path
          $source = (Resolve-Path "templates/site-repo-starter").Path
          $out = Join-Path ([System.IO.Path]::GetTempPath()) (
            "wp-platform-package-test-" + [guid]::NewGuid().ToString("N")
          )
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          & $script `
            -SourceRepoPath $source `
            -OutputDirectory $out `
            -ArtifactType Directory `
            -ArtifactName "manifest-check" `
            -Scopes themes `
            -ExtraFiles @("README.md", "missing-extra.md")

          if (-not $?) {
            throw "package helper invocation failed"
          }

          $pkg = Get-ChildItem -LiteralPath $out -Directory |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $pkg) {
            throw "package folder was not created"
          }

          $manifestPath = Join-Path $pkg.FullName "package-manifest.json"
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json

          if ($manifest.sourceRepo -ne "site-repo-starter") {
            throw "sourceRepo should be repo name only, got: $($manifest.sourceRepo)"
          }
          if ($manifest.sourceRepo -match "^[A-Za-z]:\\") {
            throw "sourceRepo leaked absolute path"
          }
          if (@($manifest.includedExtras) -notcontains "README.md") {
            throw "README.md missing from includedExtras"
          }
          if (@($manifest.includedExtras) -contains "missing-extra.md") {
            throw "missing-extra.md should not be included"
          }
          if (-not (@($manifest.warnings) | Where-Object {
            $_.name -eq "missing-extra.md" -and
            $_.reason -eq "Missing in source repo"
          })) {
            throw "missing-extra.md warning missing"
          }

      - name: Check documentation whitespace
        if: steps.scope.outputs.level == 'docs'
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $base = if ($env:EVENT_NAME -eq 'pull_request') { $env:PR_BASE_SHA } else { $env:BEFORE_SHA }
          git diff --check $base $env:HEAD_SHA

  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks full-history scan
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
